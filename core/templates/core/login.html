{% extends 'core/base4.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="d-flex justify-content-center" style="padding-top: 18vh;">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3 text-center">
          <i class="fa fa-user"></i> Login
        </h4>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <input class="form-control" name="username" placeholder="Username" autofocus required>
          </div>

          <div class="mb-3">
            <input class="form-control" type="password" name="password" placeholder="Password" required>
          </div>

          <button class="btn btn-primary w-100">
            <i class="fa fa-sign-in-alt"></i> Login
          </button>
        </form>

        {% if error %}
        <div class="alert alert-danger mt-3">
          {{ error }}
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
