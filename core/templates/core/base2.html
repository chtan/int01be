{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}EnlightenLab{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }

    .breadcrumb {
      font-size: 0.75rem;
    }
  </style>

  {% block extra_head %}
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

  <script defer
          src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script defer
          src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ]
          });">
  </script>
  {% endblock %}
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container d-flex justify-content-between">

    <!-- Left: Brand -->
    <a class="navbar-brand" href="/">EnlightenLab</a>

    <!-- Right: Login -->
    <div class="d-flex align-items-center">
      {% if user.is_authenticated %}
        <a href="{% url 'core:logout' %}" class="text-light text-decoration-none">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </a>
      {% else %}
        <a href="{% url 'core:login' %}" class="text-light text-decoration-none">
          <i class="fa-solid fa-right-to-bracket"></i>
          Login
        </a>
      {% endif %}
    </div>

  </div>
</nav>

<div class="container mt-4">
  {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Alpine.js -->
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
